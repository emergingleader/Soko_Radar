# Monthly price update for the SokoRadar app. Downloads the latest WFP Kenya prices from HDX, rebuilds the
# months after 2024 with the team's pipeline, and pushes app/raw_data/prices_after_2024.csv if it changed.
# Streamlit Community Cloud then redeploys the app.
# To run it by hand: Actions tab, then Update prices, then Run workflow.
name: Update prices

on:
  schedule:
    - cron: "0 6 8 * *"        # 06:00 UTC on the 8th of every month (WFP usually publishes early in the month)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install "numpy==2.4.6" "pandas==3.0.5" openpyxl matplotlib pillow

      - name: Download the latest prices and rebuild
        id: build
        run: python app/update_prices.py

      - name: Commit if the prices changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/raw_data/prices_after_2024.csv
          if git diff --cached --quiet; then
            echo "No new prices."
          else
            git commit -m "Update prices to ${{ steps.build.outputs.latest }}"
            git push
          fi
